# Render Blueprint: one Node web service that builds the website and runs the API.
# In Render: New + → Blueprint → pick this repository. Fill in the values marked sync: false.
services:
  - type: web
    name: sidhagora
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run deploy:build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # login tokens are signed with this; Render generates a long random value
      - key: JWT_SECRET
        generateValue: true
      # MongoDB Atlas connection string (Atlas → Connect → Drivers)
      - key: MONGO_URI
        sync: false
      # the live address, e.g. https://sidhagora.onrender.com (for share previews)
      - key: SITE_URL
        sync: false
      # optional: exact festival dates from Google Calendar
      - key: GOOGLE_API_KEY
        sync: false
